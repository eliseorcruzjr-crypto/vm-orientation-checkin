<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>VM Orientation Check-In</title>

  <script src="https://unpkg.com/html5-qrcode"
          type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
      background: white;
      border-radius: 12px;
      overflow: hidden;
    }

    #result {
      margin: 20px auto;
      padding: 20px;
      max-width: 500px;
      border-radius: 12px;
      background: white;
      min-height: 100px;
    }

    .success {
      background: #e8f5e9 !important;
      color: #1b5e20;
    }

    .warning {
      background: #fff8e1 !important;
      color: #8d6e00;
    }

    .error {
      background: #ffebee !important;
      color: #b71c1c;
    }

    .scanning {
      background: #e3f2fd !important;
      color: #1565c0;
    }

    .big {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .name {
      font-size: 22px;
      font-weight: bold;
      margin: 10px 0;
    }

    .registration {
      font-family: monospace;
      font-size: 18px;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 14px 22px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    #startButton {
      background: #1976d2;
      color: white;
    }

    #stopButton {
      background: #d32f2f;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>VM Orientation</h1>

    <div class="subtitle">
      Volunteer Check-In
    </div>

    <div id="reader"></div>

    <div>

      <button id="startButton"
              onclick="startScanner()">
        Start Scanner
      </button>

      <button id="stopButton"
              onclick="stopScanner()"
              disabled>
        Stop Scanner
      </button>

    </div>

    <div id="result" class="scanning">

      <div class="big">
        Ready to scan
      </div>

      Point the camera at the volunteer's QR code.

    </div>

  </div>


<script>

/*
 * YOUR APPS SCRIPT BACKEND
 */
const BACKEND_URL =
  "https://script.google.com/macros/s/AKfycbzvjVtNwZJ5aF6K0kPcIDzn2x0Wu0LXkO4Uh0AI6ad7I8ZWdeO2zDPyXkn6Rn92LSUp/exec";


let scanner = null;
let isProcessing = false;


/*
 * Start scanner
 */
async function startScanner() {

  if (scanner !== null) {
    return;
  }

  showResult(
    "scanning",
    "Starting camera...",
    "Please allow camera access if your browser asks."
  );

  try {

    scanner =
      new Html5Qrcode("reader");


    const cameras =
      await Html5Qrcode.getCameras();


    if (!cameras || cameras.length === 0) {

      throw new Error(
        "No camera was detected."
      );

    }


    let cameraId =
      cameras[0].id;


    /*
     * Prefer rear camera
     */
    for (
      let i = 0;
      i < cameras.length;
      i++
    ) {

      const label =
        String(
          cameras[i].label || ""
        ).toLowerCase();


      if (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      ) {

        cameraId =
          cameras[i].id;

        break;

      }

    }


    await scanner.start(

      cameraId,

      {
        fps: 10,

        qrbox: {
          width: 250,
          height: 250
        }
      },

      onScanSuccess,

      onScanFailure

    );


    document.getElementById(
      "startButton"
    ).disabled = true;


    document.getElementById(
      "stopButton"
    ).disabled = false;


    showResult(
      "scanning",
      "Scanner is ready",
      "Point the camera at the volunteer's QR code."
    );


  } catch (error) {

    console.error(error);

    scanner = null;

    showResult(
      "error",
      "Camera Error",
      escapeHtml(
        error.message ||
        String(error)
      )
    );

  }

}


/*
 * Stop scanner
 */
async function stopScanner() {

  if (!scanner) {
    return;
  }


  try {

    await scanner.stop();

    scanner.clear();

  } catch (error) {

    console.error(error);

  }


  scanner = null;


  document.getElementById(
    "startButton"
  ).disabled = false;


  document.getElementById(
    "stopButton"
  ).disabled = true;


  showResult(
    "scanning",
    "Scanner stopped",
    "Click Start Scanner to begin again."
  );

}


/*
 * QR detected
 */
function onScanSuccess(decodedText) {

  if (isProcessing) {
    return;
  }


  isProcessing = true;


  const registrationId =
    String(decodedText || "")
      .trim()
      .toUpperCase();


  showResult(
    "scanning",
    "Checking registration...",
    escapeHtml(registrationId)
  );


  checkIn(registrationId);

}


/*
 * Ignore normal scanning failures
 */
function onScanFailure(error) {
  // Ignore.
}


/*
 * Send Registration ID to Apps Script
 */
function checkIn(registrationId) {

  const callbackName =
    "checkInCallback_" +
    Date.now();


  window[callbackName] =
    function(result) {

      delete window[callbackName];

      handleCheckInResult(result);

    };


  const script =
    document.createElement("script");


  const url =
    BACKEND_URL +
    "?action=checkIn" +
    "&registrationId=" +
    encodeURIComponent(registrationId) +
    "&callback=" +
    callbackName;


  script.src = url;


  script.onerror =
    function() {

      delete window[callbackName];

      handleCheckInError({
        message:
          "Unable to contact the check-in server."
      });

    };


  document.body.appendChild(script);

}


/*
 * Handle Apps Script result
 */
function handleCheckInResult(result) {

  if (
    result.type ===
    "CHECKED_IN"
  ) {

    showResult(
      "success",
      "✓ CHECK-IN SUCCESSFUL",
      `
        <div class="name">
          ${escapeHtml(result.name)}
        </div>

        <div class="registration">
          ${escapeHtml(result.registrationId)}
        </div>

        <p>
          <strong>Time:</strong><br>
          ${escapeHtml(result.checkInTime)}
        </p>
      `
    );


    setTimeout(
      function() {

        isProcessing = false;

        resetResult();

      },
      3000
    );


    return;
  }


  if (
    result.type ===
    "ALREADY_CHECKED_IN"
  ) {

    showResult(
      "warning",
      "⚠ ALREADY CHECKED IN",
      `
        <div class="name">
          ${escapeHtml(result.name)}
        </div>

        <div class="registration">
          ${escapeHtml(result.registrationId)}
        </div>

        <p>
          This volunteer has already checked in.
        </p>

        <p>
          <strong>Previous check-in:</strong><br>
          ${escapeHtml(result.checkInTime)}
        </p>
      `
    );


    setTimeout(
      function() {

        isProcessing = false;

        resetResult();

      },
      4000
    );


    return;
  }


  showResult(
    "error",
    "✕ INVALID QR CODE",
    `
      ${escapeHtml(result.message)}
      <br><br>
      ${escapeHtml(
        result.registrationId || ""
      )}
    `
  );


  setTimeout(
    function() {

      isProcessing = false;

      resetResult();

    },
    3000
  );

}


/*
 * Server error
 */
function handleCheckInError(error) {

  console.error(error);


  showResult(
    "error",
    "System Error",
    escapeHtml(
      error.message ||
      String(error)
    )
  );


  setTimeout(
    function() {

      isProcessing = false;

      resetResult();

    },
    4000
  );

}


/*
 * Reset result
 */
function resetResult() {

  showResult(
    "scanning",
    "Ready to scan",
    "Point the camera at the volunteer's QR code."
  );

}


/*
 * Display result
 */
function showResult(
  type,
  title,
  message
) {

  const result =
    document.getElementById(
      "result"
    );


  result.className =
    type;


  result.innerHTML =
    `<div class="big">${title}</div>` +
    `<div>${message}</div>`;

}


/*
 * Escape HTML
 */
function escapeHtml(text) {

  return String(text || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>
</html>
